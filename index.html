<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEXORANT — The Infinite Identity Universe</title>
<meta name="theme-color" content="#07060a">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="intro" aria-hidden="true"><span>VEXORANT</span></div>
<header id="top">
  <div class="brand">VEXORANT</div>
  <div id="counter" title="Identity currently in view">#1</div>
  <button id="sbtn" aria-label="Search identities"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</header>
<main>
  <section class="hero"><h1>The Infinite Identity Universe</h1><p>One dimension. Endless identities.</p></section>
  <div id="feed" aria-live="off"></div>
</main>
<div id="pv" hidden role="dialog" aria-modal="true" aria-label="Profile"><div class="pvbox"><button id="pvx" aria-label="Close profile">Close</button><div id="pvc"></div></div></div>
<div id="sr" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="srbox">
    <form id="sf"><input id="si" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Identity number or name" aria-label="Identity number or name"><button type="submit">Go</button><button type="button" id="sx">Close</button></form>
    <div id="ss" role="status"></div><div id="sl"></div>
  </div>
</div>
<script src="script.js"></script>
</body></html>
